name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core (${{ matrix.build_type }}, ${{ matrix.sanitizer }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Release
            sanitizer: OFF
          - build_type: Debug
            sanitizer: address,undefined
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ zlib1g-dev python3

      # Фикстуры генерирует цель vw_test_data (офлайн, детерминированно,
      # ровно один раз) — отдельный шаг здесь только дублировал бы работу.

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DVW_BUILD_GUI=OFF
          -DVW_ENABLE_SANITIZERS=${{ matrix.sanitizer }}
          -DVW_MARCH=off

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure
